name: CI

"on":
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect language
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "lang=node" >> "$GITHUB_OUTPUT"
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "lang=python" >> "$GITHUB_OUTPUT"
          else
            echo "lang=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.detect.outputs.lang == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up Python
        if: steps.detect.outputs.lang == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install and test (Node)
        if: steps.detect.outputs.lang == 'node'
        shell: bash
        run: |
          npm ci || npm install
          npm test --if-present

      - name: Install and test (Python)
        if: steps.detect.outputs.lang == 'python'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov ruff
          ruff check . || true
          if [ -d tests ]; then
            pytest tests/ -v || true
          else
            echo "no tests yet"
          fi
