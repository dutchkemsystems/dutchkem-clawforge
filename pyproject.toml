[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawforge"
version = "0.1.0"
description = "Autonomous Claw Earn Marketplace Integration Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "eth-account>=0.13.0",
    "web3>=7.0.0",
    "cryptography>=43.0.0",
    "apscheduler>=3.10.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = false
warn_unused_configs = true
warn_redundant_casts = false
no_implicit_optional = false
ignore_missing_imports = true
disable_error_code = [
    "no-any-return",
    "var-annotated",
    "no-untyped-call",
    "import-untyped",
]
exclude = ["^tests/", "^build/", "^dist/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "F401",  # unused imports (common in test scaffolding)
    "F841",  # unused local variables (test fixtures)
    "I001",  # import sorting (kept loose in tests)
    "E501",  # line length
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "F401",
    "F841",
    "I001",
    "E501",
]
